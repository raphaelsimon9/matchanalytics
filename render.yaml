services:
  - type: web
    name: matchinsights-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_PAPI_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ODDSAPIIO_KEY
        sync: false
      - key: PREFERRED_BOOKMAKERS
        sync: false
